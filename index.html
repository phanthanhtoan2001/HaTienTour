<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Báo cáo ComplaintBox</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <h2>Dữ liệu ComplaintBox (01/08/2025 → 01/09/2025)</h2>
    <table id="complaintTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Postdate</th>
                <th>ID</th>
                <th>Name</th>
                <th>Area</th>
                <th>Division</th>
                <th>Detail</th>
                <th>Image</th>
                <th>Comment</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadComplaintData() {
            let url = "https://tri-viet.com.vn/Report/ComplaintBoxList?FromDate=2025-01-01&ToDate=2030-12-30";
            let res = await fetch(url);
            let html = await res.text();

            // Parse HTML thành DOM
            let parser = new DOMParser();
            let doc = parser.parseFromString(html, "text/html");

            // Chọn tất cả hàng (bỏ header)
            let rows = doc.querySelectorAll("table tr");
            let tbody = document.querySelector("#complaintTable tbody");

            rows.forEach((row, i) => {
                if (i === 0) return; // bỏ header
                let cols = row.querySelectorAll("td");
                if (cols.length === 0) return;

                let tr = document.createElement("tr");
                cols.forEach(td => {
                    let newTd = document.createElement("td");
                    newTd.textContent = td.textContent.trim();
                    tr.appendChild(newTd);
                });
                tbody.appendChild(tr);
            });
        }

        loadComplaintData();
    </script>
</body>

</html>
